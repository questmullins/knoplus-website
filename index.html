<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knoplus | Template Preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #050506;
      --white: #f6f3ec;
      --muted: rgba(246,243,236,.68);
      --line: rgba(255,255,255,.12);
      --accent: #f7f1e7;
      --sidebar-width: 344px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Stack Sans Text", sans-serif;
      background: var(--black);
      color: var(--white);
      overflow: hidden;
    }

    a,
    button {
      font: inherit;
      color: inherit;
    }

    a {
      text-decoration: none;
    }

    .app {
      height: 100vh;
      width: 100vw;
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      background: #050506;
    }

    aside {
      background: rgba(5,5,6,.96);
      border-right: 1px solid rgba(255,255,255,.1);
      padding: 44px 48px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      z-index: 10;
      box-shadow: 18px 0 48px rgba(0,0,0,.34);
    }

    .brand {
      font-family: "Kanit", sans-serif;
      font-size: 23px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .template-nav {
      align-self: center;
      display: grid;
    }

    .nav-label {
      color: rgba(246,243,236,.58);
      text-transform: uppercase;
      letter-spacing: .42em;
      font-size: 13px;
      font-weight: 300;
      margin-bottom: 28px;
    }

    .template-btn {
      appearance: none;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,.11);
      background: transparent;
      min-height: 78px;
      text-align: left;
      cursor: pointer;
      color: rgba(246,243,236,.72);
      font-size: 24px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      transition: color .25s ease;
    }

    .template-btn:hover,
    .template-btn.active {
      color: var(--white);
    }

    .plus {
      position: relative;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      transition: transform .28s ease;
    }

    .plus::before,
    .plus::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 1.5px;
      background: currentColor;
      transform: translate(-50%, -50%);
    }

    .plus::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .template-btn.active .plus {
      transform: rotate(45deg);
    }

    .sidebar-note {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .cta-copy {
      color: rgba(246,243,236,.82);
      font-size: 18px;
      line-height: 1.45;
      font-weight: 300;
    }

    .cta-button {
      width: fit-content;
      min-height: 44px;
      padding: 0 22px;
      border: 1px solid rgba(246,243,236,.28);
      background: rgba(246,243,236,.08);
      color: rgba(246,243,236,.9);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: .32em;
      text-transform: uppercase;
      transition:
        color .25s ease,
        background .25s ease,
        border-color .25s ease,
        transform .25s ease;
    }

    .cta-button:hover {
      color: #050506;
      background: var(--white);
      border-color: var(--white);
      transform: translateX(4px);
    }

    .stage {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .preview-bg,
    .preview-bg-next {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(0,0,0,.52), rgba(0,0,0,.12)),
        var(--bg);
      background-size: cover;
      background-position: center;
      z-index: -3;
    }

    .preview-bg {
      opacity: 1;
      transition: opacity .7s ease;
    }

    .preview-bg-next {
      opacity: 0;
      transition: opacity .7s ease;
    }

    .preview-bg-next.show {
      opacity: 1;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 40% 52%, rgba(255,255,255,.055), transparent 28%),
        linear-gradient(90deg, rgba(0,0,0,.25), transparent 58%);
      z-index: -1;
      pointer-events: none;
    }

    .top-menu {
      position: absolute;
      top: 44px;
      right: 46px;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--white);
      cursor: pointer;
      z-index: 20;
      display: grid;
      place-items: center;
    }

    .menu-plus {
      position: relative;
      width: 22px;
      height: 22px;
      transition: transform .28s ease;
    }

    .menu-plus::before,
    .menu-plus::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 1.5px;
      background: currentColor;
      transform: translate(-50%, -50%);
    }

    .menu-plus::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .top-menu.open .menu-plus {
      transform: rotate(45deg);
    }

    .menu-panel {
      position: absolute;
      top: 92px;
      right: 46px;
      width: 270px;
      padding: 34px;
      background: rgba(11,11,11,.84);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 24px 60px rgba(0,0,0,.38);
      z-index: 18;
      opacity: 0;
      transform: translateY(-12px) scale(.98);
      pointer-events: none;
      transition: opacity .28s ease, transform .28s ease;
    }

    .menu-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .menu-panel nav {
      display: grid;
      gap: 22px;
    }

    .menu-panel a {
      color: rgba(246,243,236,.86);
      font-size: 18px;
      font-weight: 300;
      transition: color .2s ease;
    }

    .menu-panel a:hover {
      color: var(--white);
    }

    .menu-divider {
      height: 1px;
      background: rgba(255,255,255,.12);
      margin: 28px 0;
    }

    .social-row {
      display: flex;
      gap: 24px;
      color: rgba(246,243,236,.84);
      font-size: 20px;
    }

    .content {
      height: 100%;
      padding: 0 7vw;
      display: flex;
      align-items: center;
    }

    .copy {
      width: 100%;
      max-width: 760px;
      opacity: 1;
      transform: translateX(0);
      transition:
        opacity .35s ease,
        transform .35s ease;
    }

    .copy.fade {
      opacity: 0;
      transform: translateX(-4px);
    }

    .copy-anchor {
      width: 100%;
      max-width: 760px;
      min-height: 540px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .eyebrow {
      color: rgba(246,243,236,.68);
      text-transform: uppercase;
      letter-spacing: .55em;
      font-size: 12px;
      font-weight: 300;
      margin-bottom: 40px;
    }

    h1 {
      font-family: "Kanit", sans-serif;
      font-size: clamp(48px, 6.3vw, 96px);
      line-height: .9;
      letter-spacing: -0.055em;
      font-weight: 300;
      max-width: 760px;
    }

    h1 em {
      font-family: Georgia, serif;
      font-weight: 300;
      letter-spacing: -.05em;
    }

    p {
      color: rgba(246,243,236,.74);
      max-width: 430px;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 300;
      margin-top: 34px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 48px;
    }

    .circle-link {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: var(--white);
      color: var(--black);
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .25s ease;
      position: relative;
    }

    .circle-plus {
      position: relative;
      width: 18px;
      height: 18px;
      display: block;
      transition: transform .28s ease;
    }

    .circle-plus::before,
    .circle-plus::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 1.75px;
      background: currentColor;
      transform: translate(-50%, -50%);
    }

    .circle-plus::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .circle-link:hover .circle-plus {
      transform: rotate(90deg);
    }

    .text-link {
      border: none;
      background: transparent;
      color: rgba(246,243,236,.86);
      cursor: pointer;
      font-size: 12px;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: .42em;
      transition: color .2s ease;
    }

    .text-link:hover {
      color: var(--white);
    }

    .counter {
      position: absolute;
      right: 46px;
      bottom: 42px;
      color: rgba(255,255,255,.72);
      font-size: 18px;
      letter-spacing: .18em;
      z-index: 4;
      display: inline-grid;
      grid-template-areas: "stack";
      align-items: center;
      justify-items: center;
      min-width: 92px;
      min-height: 28px;
      font-variant-numeric: tabular-nums;
    }

    .counter-value {
      grid-area: stack;
      line-height: 1;
      white-space: nowrap;
      opacity: 1;
      transition: opacity .34s ease;
    }

    .counter-value.next {
      opacity: 0;
    }

    .counter.crossfade .counter-value.current {
      opacity: 0;
    }

    .counter.crossfade .counter-value.next {
      opacity: 1;
    }

    .transition-screen {
      position: fixed;
      inset: 0;
      background: #050506;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity .7s ease;
    }

    .transition-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .transition-logo {
      font-family: "Kanit", sans-serif;
      font-size: clamp(32px, 4vw, 54px);
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--white);
      opacity: 0;
      transform: translateY(10px);
      transition:
        opacity .5s ease,
        transform .5s ease;
    }

    .transition-screen.active .transition-logo {
      opacity: 1;
      transform: translateY(0);
      transition-delay: .35s;
    }

    @media (max-width: 950px) {
      :root {
        --sidebar-width: 260px;
      }

      aside {
        padding: 34px 28px;
      }

      .template-btn {
        font-size: 18px;
      }

      .content {
        padding-left: 6vw;
      }

      h1 {
        font-size: 54px;
      }

      .copy-anchor {
        min-height: 500px;
      }

      .cta-copy {
        font-size: 16px;
      }

      .cta-button {
        font-size: 10px;
        letter-spacing: .24em;
        padding: 0 16px;
      }
    }

    @media (max-width: 720px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        position: absolute;
        inset: 0 auto 0 0;
        width: 250px;
        background: rgba(5,5,6,.9);
        backdrop-filter: blur(16px);
      }

      .content {
        padding-left: 285px;
        padding-right: 24px;
      }

      h1 {
        font-size: 44px;
      }

      .copy-anchor {
        min-height: 460px;
      }

      .menu-panel {
        right: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <aside>
      <div class="brand">Knoplus</div>

      <div class="template-nav">
        <div class="nav-label">Templates</div>

        <button class="template-btn active" data-index="0">
          <span>Traditional Auto</span>
          <span class="plus"></span>
        </button>

        <button class="template-btn" data-index="1">
          <span>Synergy</span>
          <span class="plus"></span>
        </button>

        <button class="template-btn" data-index="2">
          <span>Editorial Local</span>
          <span class="plus"></span>
        </button>

        <button class="template-btn" data-index="3">
          <span>Dark Luxury</span>
          <span class="plus"></span>
        </button>
      </div>

      <div class="sidebar-note cta-note">
        <div class="cta-copy">
          Know More.<br>
          Know Better.<br>
          Knoplus.
        </div>

        <a
          href="mailto:knopluswebsites@gmail.com"
          class="cta-button"
        >
          Contact Us
        </a>
      </div>
    </aside>

    <section class="stage">
      <div class="preview-bg"></div>
      <div class="preview-bg-next"></div>

      <button class="top-menu" id="menuToggle" aria-label="Open menu">
        <span class="menu-plus"></span>
      </button>

      <div class="menu-panel" id="menuPanel">
        <nav>
          <a href="#">About Us</a>
          <a href="#">Our Process</a>
          <a href="#">Pricing</a>
          <a href="#">FAQ</a>
          <a href="mailto:knopluswebsites@gmail.com">Contact Us</a>
        </nav>

        <div class="menu-divider"></div>

        <div class="social-row">
          <a href="#">◎</a>
          <a href="#">in</a>
          <a href="mailto:knopluswebsites@gmail.com">✉</a>
        </div>
      </div>

      <div class="content">
        <div class="copy">
          <div class="copy-anchor">
            <div class="eyebrow" id="eyebrow">Templates</div>

            <h1 id="title">
              Design is<br>
              a starting point.<br>
              Direction is <em>yours.</em>
            </h1>

            <p id="description">
              Explore live templates, find what feels right, and we’ll build from there.
            </p>

            <div class="actions">
              <button class="circle-link" id="mainLink" type="button" aria-label="Open template">
                <span class="circle-plus"></span>
              </button>

              <button class="text-link" id="textLink" type="button">
                Explore Template
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="counter" id="counter">
        <span class="counter-value current" id="counterCurrent">01 / 04</span>
        <span class="counter-value next" id="counterNext">01 / 04</span>
      </div>
    </section>

  </main>

  <div class="transition-screen" id="transitionScreen">
    <div class="transition-logo">Knoplus</div>
  </div>

  <script>
    const templates = [
      {
        label: "Templates",
        title: `Design is<br>a starting point.<br>Direction is <em>yours.</em>`,
        description: "Explore live templates, find what feels right, and we’ll build from there.",
        image: `url("https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1800&q=80")`,
        link: "https://m5x-mechanix-website.questmullins.workers.dev/"
      },
      {
        label: "Synergy",
        title: `Clean space.<br>Quiet confidence.<br>A site that <em>breathes.</em>`,
        description: "A modern concept for brands that want to feel calm, intentional, and sharply presented.",
        image: `url("https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1800&q=80")`,
        link: "https://next-m5x-concepts.questmullins.workers.dev/"
      },
      {
        label: "Editorial Local",
        title: `A neighborhood site<br>without the template<br><em>aftertaste.</em>`,
        description: "Built for local businesses that want trust, clarity, and a little visual personality.",
        image: `url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1800&q=80")`,
        link: "https://m5x-mechanix-website.questmullins.workers.dev/"
      },
      {
        label: "Dark Luxury",
        title: `Premium doesn’t<br>need to shout.<br>It needs to <em>feel.</em>`,
        description: "A moodier direction for businesses that want to look polished, cinematic, and high-end.",
        image: `url("https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1800&q=80")`,
        link: "https://next-m5x-concepts.questmullins.workers.dev/"
      }
    ];

    const buttons = document.querySelectorAll(".template-btn");
    const bg = document.querySelector(".preview-bg");
    const bgNext = document.querySelector(".preview-bg-next");
    const copy = document.querySelector(".copy");

    const eyebrow = document.getElementById("eyebrow");
    const title = document.getElementById("title");
    const description = document.getElementById("description");

    const counter = document.getElementById("counter");
    const counterCurrent = document.getElementById("counterCurrent");
    const counterNext = document.getElementById("counterNext");

    const mainLink = document.getElementById("mainLink");
    const textLink = document.getElementById("textLink");

    const menuToggle = document.getElementById("menuToggle");
    const menuPanel = document.getElementById("menuPanel");
    const transitionScreen = document.getElementById("transitionScreen");

    let currentIndex = 0;
    let counterDisplay = "01 / 04";

    function formatCounter(index) {
      return `${String(index + 1).padStart(2, "0")} / ${String(templates.length).padStart(2, "0")}`;
    }

    function updateCounter(index) {
      const nextValue = formatCounter(index);

      if (nextValue === counterDisplay) return;

      counterNext.textContent = nextValue;
      counter.classList.add("crossfade");

      setTimeout(() => {
        counterCurrent.textContent = nextValue;
        counter.classList.remove("crossfade");
        counterDisplay = nextValue;
      }, 360);
    }

    function setTemplate(index) {
      if (index === currentIndex) return;

      const item = templates[index];

      buttons.forEach(btn => btn.classList.remove("active"));
      buttons[index].classList.add("active");

      copy.classList.add("fade");
      updateCounter(index);

      bgNext.style.setProperty("--bg", item.image);
      bgNext.classList.add("show");

      setTimeout(() => {
        bg.style.setProperty("--bg", item.image);
        bgNext.classList.remove("show");

        eyebrow.textContent = item.label;
        title.innerHTML = item.title;
        description.textContent = item.description;

        copy.classList.remove("fade");

        currentIndex = index;
      }, 420);
    }

    function openCurrentTemplate() {
      const destination = templates[currentIndex].link;

      transitionScreen.classList.add("active");

      setTimeout(() => {
        window.location.href = destination;
      }, 1450);
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        setTemplate(Number(button.dataset.index));
      });
    });

    menuToggle.addEventListener("click", () => {
      menuToggle.classList.toggle("open");
      menuPanel.classList.toggle("open");
    });

    mainLink.addEventListener("click", openCurrentTemplate);
    textLink.addEventListener("click", openCurrentTemplate);

    bg.style.setProperty("--bg", templates[0].image);
    bgNext.style.setProperty("--bg", templates[0].image);

    counterCurrent.textContent = "01 / 04";
    counterNext.textContent = "01 / 04";
  </script>
</body>
</html>
